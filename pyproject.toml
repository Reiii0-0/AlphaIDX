[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaidx"
version = "0.2.0"
description = "Quantitative portfolio optimization, stochastic risk simulation, and walk-forward backtesting for IDX equities."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "yfinance>=0.2.50,<1.0",
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.4,<3.0",
    "scipy>=1.13.0,<2.0",
    "plotly>=5.22.0,<7.0",
    "python-dotenv>=1.0.0,<2.0",
    "matplotlib>=3.9.0,<4.0",
    "streamlit>=1.40.0,<2.0",
    "altair>=5.3.0,<7.0",
    "pyarrow>=17.0.0",
    "arch>=7.0.0,<9.0",
    "statsmodels>=0.14.2,<1.0",
    "nbformat>=5.9.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.27.0",
]

[project.scripts]
alphaidx = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
